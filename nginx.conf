# 工业知识库前端 Nginx 部署配置（参考）
# 前端为静态文件，/api 与 /ws 反代到 Node 后端（127.0.0.1:3000）
server {
    listen 80;
    server_name _;

    root /opt/kb-web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 构建产物带内容哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # REST API（后端路由带 /api 前缀；若不带，把 proxy_pass 改为 http://127.0.0.1:3000/ 以剥掉前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 需要特殊配置
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;  # 长连接不能超时断开
    }

    # history 路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
