# 工厂知识库后端配置。改完保存，重启后端即可，不用改代码。
# 密钥不要写在这里，写在 server/.env。

# 检索：先向 GBrain 取一批，再按登录人的领域和密级丢掉不能看的，最后留给模型 keep 条。
search:
  fetchLimit: 30
  keep: 5
  maxPages: 2
  # 取前 N 条作为候选；排序主依据是 GBrain score，只给前 keep 条读整页。
  rerankCandidates: 12
  # 覆盖率加权，相对 score 要小。0.6 会把「我们/自研」多的无关页抬到手册页前面。
  coverageWeight: 0.05
  # 每条资料送进模型的字数上限（长页面按命中位置取窗口）。
  pageChars: 4000
  # 检索前从问题里删掉这些说法，留下设备名和故障码。按长到短匹配。
  # 只写至少两个字的短语，不要写「的」「了」「用」这种单字。
  questionPhrases: [怎么处理, 如何处理, 怎么办, 如何, 是什么]

# GBrain 的 score 是排序分，不是 0 到 1 的概率。
# 联调时如果每条回答都是「低」，把下面两个数调小。
confidence:
  highMin: 0.03
  mediumMin: 0.015

# 过滤后一条都没有时，原样推给用户，不调用模型。
noEvidence:
  text: 知识库中没有找到与该问题直接相关的资料。为避免误导，我不做推测性回答。你可以将问题转入问题队列，由领域责任人解答后入库。
  score: 0.2

# 整句匹配这些说法时不检索，按正常人打招呼回复。问设备/规程仍走知识库。
chat:
  phrases: [你好, 您好, 嗨, hi, hello, 在吗, 在么, 早上好, 中午好, 下午好, 晚上好, 谢谢, 感谢, 多谢, 再见, 拜拜, 好的, 收到, 你是谁, 你能做什么, 你会什么]
  fallback: 你好，我是工厂知识库助手。问设备、规程或故障时我会按资料回答；日常打个招呼也可以。

  # 「告知」而不是提问时：不查库，只回一句确认 + 提示可入库（提问/告知的判定词可在这调）
  ackText: 知道了。要不要把这条存进知识库？（答完点下面的「存入知识库」）
  questionWords: [怎么, 如何, 为什么, 是什么, 什么, 多少, 多大, 在哪, 哪里, 哪个, 哪些, 能不能, 可不可以, 是否, 有没有, 会不会, 需不需要, 请问, 吗]
  # 对话历史：送给模型的最近消息条数；每人最多会话数；单场最多轮数（超出自动新开）。
  historyTurns: 8
  maxSessions: 50
  maxTurnsPerSession: 100
  # 外部 agent 不带 sessionId 时，空闲这么多小时内接到上一场；传 "new": true 会新开。
  agentIdleHours: 8
  # 周归档：一周里至少这么多条消息才写成文件（落 server/data/archives，不自动进正式库）。
  archiveMinMessages: 4
# 上传文档、转入问题队列时，用这些词判断领域。模型不可用时也用这张表。
keywords:
  electrical: [变频, 配电, 电气, 电机, PLC, UPS, 电缆, 开关柜]
  mechanical: [锅炉, 泵, 磨机, 空压, 减速, 轴承, 输送, 润滑]
  dispatch: [调度, 交接班, 值班, 排产]
sensitivityKeywords:
  top_secret: [绝密, 核心算法]
  confidential: [机密, 报价, 合同, 供应商]
  public: [公开, 国家标准, 产品介绍]
defaults:
  field: electrical
  sensitivity: internal

# 文本生成。baseUrl 不要带 /chat/completions，程序会自己接上。
llm:
  baseUrl: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.2
  maxTokens: 2000

# 照片。baseUrl 留空表示还没接视觉模型，此时发送照片会得到明确提示。
# 接口需要兼容 OpenAI 的 image_url。
vision:
  baseUrl: ""
  model: ""
  maxImages: 4

# GBrain 命令。Windows 上如果 gbrain 不能直接运行，把 command 改成 bun 或 node 的完整路径，
# 并把启动参数写进 argsPrefix。用户的问题只会作为单独参数传入，不会拼进 shell。
gbrain:
  command: gbrain
  argsPrefix: []
  timeoutMs: 25000

# 工厂规程多数彼此不链接。打开后会把 gbrain orphans 的结果算作「引用完整性」，
# 独立成篇的规程也会被报出来。
health:
  reportIslandedPages: false

limits:
  imageBytes: 10485760
  docBytes: 20971520
  classifyChars: 6000

auth:
  cookieName: kb_sid
  ttlDays: 7

# 飞书：密钥写 server/.env。群里默认只回复 @机器人。
feishu:
  groupOnlyMention: true

# 外部通道（飞书/豆包等 agent）问不到资料时，自动进问题队列
questions:
  autoQueueFromAgent: true
  dedupeHours: 24
  # true=权限看不全全部项目时不入队。默认 false：照样入队，响应里带 permissionLimited。
  requireFullAccess: false

# 外部 agent 密级：false=按账号权限（owner/admin 可见 confidential，top_secret 仍只给主人）
# true=只带 public/internal，机密不出云端
agent:
  publicOnlyOnly: false
